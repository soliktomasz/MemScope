name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore MemoryProfiler.sln

      - name: Build
        run: dotnet build MemoryProfiler.sln --configuration Release --no-restore

      - name: Test
        env:
          MEMSCOPE_DIAG_ARTIFACT_DIR: ${{ github.workspace }}/artifacts
        run: dotnet test MemoryProfiler.sln --configuration Release --no-build

      # TEMPORARY CI DIAGNOSTICS: preserve captured acceptance dumps for local
      # repro of the Windows decode failure. Remove before finalizing.
      - name: Upload captured dumps
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: captured-dumps-${{ matrix.os }}
          path: artifacts/**/*.dmp
          if-no-files-found: ignore
          retention-days: 1
